# Geometry-R1 Phase 1: Cold-Start SFT Configuration
# Training Qwen2.5-VL-3B-Instruct with distilled pseudo-CoT data

model:
  name: "Qwen/Qwen2.5-VL-3B-Instruct"
  trust_remote_code: true
  use_peft: true
  peft_config:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  output_dir: "output/sft_phase1"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 10
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true

data:
  train_file: "data/sft_geometry3k.jsonl"
  image_dir: "data/images/sft"
  max_length: 2048
  preprocessing_num_workers: 4

evaluation:
  eval_steps: 100
  eval_batch_size: 4
