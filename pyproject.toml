[project]
name = "geometry-r1"
version = "0.1.0"
description = "Two-stage training pipeline for teaching vision-language models to solve geometry problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "transformers>=4.57.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    # TRL for RL training
    "trl>=0.9.0",
    # Qwen-VL specific
    "qwen-vl-utils>=0.0.14",
    # Dataset loading
    "datasets>=2.14.0",
    # Math and symbolic computation for reward
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.1",  # Required for sympy LaTeX parsing
    # Visualization and data processing
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    # Configuration
    "pyyaml>=6.0",
    # Progress bars and logging
    "tqdm>=4.66.0",
    # Alibaba DashScope API for Qwen VL
    "dashscope>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
